# ─────────────────────────────────────────────────────────────────────────────
# Lotse template — copy into your project's .github/workflows/
#
# Automatic status-label transitions on issues as their implementing PRs move.
# Only implementation PRs trigger it (detected by "Closes #<n>" in the body →
# GitHub links the issue as a closingIssueReference). Spec/docs PRs use "Refs #"
# and trigger nothing.
#
# Transitions:
#   PR opened (draft)       → status:in-progress
#   PR opened (ready)       → status:in-review
#   PR converted_to_draft   → status:in-progress
#   PR ready_for_review     → status:in-review
#   PR closed UNmerged      → status:ready (back to the ready pool)
#   PR merged               → status:* removed (issue auto-closes via "Closes #")
#
# ADAPT: `runs-on` is set to ubuntu-latest; change it if you use self-hosted runners.
# ─────────────────────────────────────────────────────────────────────────────
name: ticket-status-flow

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target status and apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # Target status per event. Empty = do nothing (spec PRs never reach the
          # loop below because they carry no closing reference).
          case "$EVENT_ACTION" in
            opened|reopened|edited)
              # edited: recompute in case the body switches from "Refs" to "Closes".
              if [ "$PR_DRAFT" = "true" ]; then
                TARGET="in-progress"
              else
                TARGET="in-review"
              fi
              ;;
            ready_for_review)   TARGET="in-review" ;;
            converted_to_draft) TARGET="in-progress" ;;
            closed)
              if [ "$PR_MERGED" = "true" ]; then TARGET="__clear__"; else TARGET="ready"; fi
              ;;
            *) TARGET="" ;;
          esac

          if [ -z "$TARGET" ]; then
            echo "No transition for action=$EVENT_ACTION"; exit 0
          fi

          # Only issues this PR closes ("Closes #<n>").
          ISSUES=$(gh api graphql -f query='
            query($repo: String!, $owner: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 20) { nodes { number } }
                }
              }
            }' \
            -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          if [ -z "$ISSUES" ]; then
            echo "No Closes references — spec or stand-alone PR. Nothing to do."; exit 0
          fi

          for issue in $ISSUES; do
            # Guard: on "closed UNmerged", do NOT drop the issue back to ready if
            # another open PR still closes it (protects parallel work).
            if [ "$TARGET" = "ready" ]; then
              OTHER_OPEN=$(gh api graphql -f query='
                query($o:String!,$n:String!,$num:Int!){
                  repository(owner:$o,name:$n){
                    issue(number:$num){
                      closedByPullRequestsReferences(first:20,includeClosedPrs:false){
                        nodes { number state isDraft }
                      }}}}' \
                -F o="${REPO%/*}" -F n="${REPO#*/}" -F num="$issue" \
                --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[]
                       |select(.state=="OPEN") |select(.number != '"$PR_NUMBER"')]|length')
              if [ "${OTHER_OPEN:-0}" -ge 1 ]; then
                echo "→ #$issue: SKIP ready — $OTHER_OPEN other open closing PR(s)."
                continue
              fi
            fi

            echo "→ #$issue: status:$TARGET"

            # Remove only the status:* labels that are actually present (fail-loud).
            CURRENT=$(gh issue view "$issue" --repo "$REPO" --json labels \
              --jq '.labels|map(.name)|map(select(startswith("status:")))|.[]')
            for label in $CURRENT; do
              gh issue edit "$issue" --repo "$REPO" --remove-label "$label"
            done

            if [ "$TARGET" != "__clear__" ]; then
              gh issue edit "$issue" --repo "$REPO" --add-label "status:$TARGET"
            fi

            # Verify, don't trust: read the target state back or fail red.
            AFTER=$(gh issue view "$issue" --repo "$REPO" --json labels \
              --jq '.labels|map(.name)|map(select(startswith("status:")))|join(",")')
            if [ "$TARGET" = "__clear__" ]; then
              [ -z "$AFTER" ] || { echo "::error::#$issue: status label lingers after clear: $AFTER"; exit 1; }
            else
              [ "$AFTER" = "status:$TARGET" ] || { echo "::error::#$issue: expected status:$TARGET, got: ${AFTER:-<empty>}"; exit 1; }
            fi
            echo "  ✓ #$issue status = ${AFTER:-<empty>}"
          done
